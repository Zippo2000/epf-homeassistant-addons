name: "E-Paper Photo Frame (EPF)"
version: "2.0.0"
slug: "epf-eink-addon"
description: "E-Ink Photo Frame with Immich and ComfyUI integration for displaying photos on E-Ink displays"
url: "https://github.com/Zippo2000/epf-homeassistant-addons"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: application
boot: auto
init: false
ingress: true
ingress_port: 5000
panel_icon: mdi:image-frame
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Web interface and API endpoint for ESP32"
webui: "http://[HOST]:[PORT:5000]"
options:
  image_source: "immich"
  immich_api_key: ""
  immich_url: ""
  album_name: "eink"
  ha_api_token: ""
  ha_url: ""
  comfyui_prompt: ""
  comfyui_negative_prompt: ""
  comfyui_width: 800
  comfyui_height: 480
  comfyui_seed: -1
  comfyui_max_generations: 50
  comfyui_entity_id: ""
  comfyui_direct_url: ""
  comfyui_workflow_json: ""
  rotation_angle: 270
  color_enhance: 1.8
  contrast: 0.9
  dithering_strength: 1.0
  display_mode: "fill"
  image_order: "random"
  dithering_method: "atkinson"
  wakeup_interval: 1440
  sleep_start_hour: 23
  sleep_start_minute: 0
  sleep_end_hour: 6
  sleep_end_minute: 0
  log_level: "info"
schema:
  image_source: "list(immich|comfyui_ha|comfyui_direct)"
  immich_api_key: "str"
  immich_url: "url"
  album_name: "str"
  ha_api_token: "str"
  ha_url: "url?"
  comfyui_prompt: "str?"
  comfyui_negative_prompt: "str?"
  comfyui_width: "int(256,2048)?"
  comfyui_height: "int(256,2048)?"
  comfyui_seed: "int(-1,999999999)?"
  comfyui_max_generations: "int(1,200)?"
  comfyui_entity_id: "str?"
  comfyui_direct_url: "url?"
  comfyui_workflow_json: "str?"
  rotation_angle: "list(0|90|180|270)"
  color_enhance: "float(0,3)"
  contrast: "float(0,2)"
  dithering_strength: "float(0,1)"
  display_mode: "list(fit|fill)"
  image_order: "list(random|newest)"
  dithering_method: "list(atkinson|floyd-steinberg)"
  wakeup_interval: "int(30,1440)"
  sleep_start_hour: "int(0,23)"
  sleep_start_minute: "int(0,59)"
  sleep_end_hour: "int(0,23)"
  sleep_end_minute: "int(0,59)"
  log_level: "list(debug|info|warning|error)"
